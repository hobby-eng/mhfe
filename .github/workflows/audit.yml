name: RustSec audit

on:
  # Branches, as for CI, Dependabot's through their pull requests alone (AUD-023-BLD006). A
  # release tag is audited by release.yml, which calls this workflow.
  push:
    branches: ["**", "!dependabot/**"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 4 * * 1"
  # The release workflow audits the tagged commit in a job of its own, apart from the job that
  # builds the attested archives (AUD-023-BLD007).
  workflow_call:
  workflow_dispatch:

# As in ci.yml: a branch of this repository and its pull request share one group.
concurrency:
  group: >-
    rustsec-${{ github.ref_type }}
    ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Cargo.lock against RustSec
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false
