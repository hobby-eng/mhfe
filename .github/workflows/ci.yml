name: CI

on:
  # Branches only: the release workflow calls this one for the tagged commit itself.
  push:
    branches: ["**"]
  pull_request:
  # The release workflow runs these checks on the tagged commit before it publishes, so that a
  # release cannot skip any of them (AUD-015-BLD002). Its own canonical job builds the assets.
  workflow_call:
  # By hand, the checks with the canonical build of this workflow.
  workflow_dispatch:

# A newer push to the same branch or pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DPRINT: "0.63.0"
      DPRINT_SHA256: f58b5d7c13ccd613cfa264f1ae82d4e5db1373f8fe20462bc1126051d111b0ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        run: rustup show
      # A secret command stops on unencrypted swap it cannot forbid, and this runner has no user
      # systemd to forbid it.
      - name: Turn swap off
        run: sudo swapoff -a
      - name: Verify standalone dependency graph
        run: cargo xtask standalone
      # dprint formats the Markdown, JSON, TOML, YAML and the JavaScript of the check pages
      # (CORE-21); dprint.json pins its plugins with their SHA-256.
      - name: Install dprint, checked against its SHA-256
        run: |
          archive="dprint-x86_64-unknown-linux-gnu.zip"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/dprint/dprint/releases/download/$DPRINT/$archive"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Check formatting
        run: dprint check
      - name: Install Emscripten 6.0.12
        run: |
          git clone --depth 1 --branch 6.0.12 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # Formatting, clippy for native and WebAssembly, the fast tests, the build and static checks
      # of the browser package and the release-artifact check.
      - name: Run all checks
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          scripts/check.sh
      # The browser package that check.sh built in real browsers, and its comparison with the
      # program: by hand only. A release runs these checks on its canonical archives (release.yml).
      - name: Check the browser package in Chrome and Firefox
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 60
        uses: ./.github/actions/browser-checks

  # The fast tests on Windows and macOS, and the hidden password input in each system's own
  # pseudo-terminal, with public test data only. The release builds for these systems come from
  # the canonical container (Windows) and release.yml (macOS); this runs their code natively.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Code for macOS or Windows alone is compiled only here, so warnings fail the job.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run the fast tests
        run: cargo test --locked
      - name: Build the command-line tool
        run: cargo build --locked
      - name: Check hidden input in a Unix pseudo-terminal
        if: runner.os == 'macOS'
        timeout-minutes: 20
        run: cargo xtask terminal target/debug/mhfe
      - name: Check hidden input in a Windows pseudo-console
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: cargo xtask terminal target/debug/mhfe.exe

  canonical-build:
    # An hour-long build runs only by hand and for a release, whose workflow builds the assets
    # itself; never on a push or a pull request.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The tests in the container run secret commands, which stop on unencrypted swap there.
      - name: Turn swap off
        run: sudo swapoff -a
      - name: Build and verify canonical release assets
        run: scripts/build-reproducible.sh
      - name: Print canonical checksums
        run: cat canonical-output/release/SHA256SUMS
      - name: Preserve canonical build assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mhfe-canonical-${{ github.sha }}
          path: canonical-output/release/
          if-no-files-found: error
          retention-days: 7
