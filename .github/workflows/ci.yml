name: CI

on:
  # Branches only: a release tag names a commit that CI has already checked on its branch, and
  # the release workflow builds and replays the vectors itself.
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch or pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify standalone dependency graph
        run: |
          cargo metadata --locked --format-version 1 | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          root_manifest = data["workspace_root"] + "/Cargo.toml"
          foreign = [
              p["manifest_path"]
              for p in data["packages"]
              if p["source"] is None and p["manifest_path"] != root_manifest
          ]
          if foreign:
              raise SystemExit(f"unexpected local/path packages: {foreign}")
          '
      # The Node.js of the workspace for Prettier, the browser package checks and Playwright.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # The workspace style for JavaScript, TypeScript, Markdown, JSON and YAML: double quotes,
      # 100 columns. Prettier comes from package-lock.json, checked against its integrity hash.
      - name: Check formatting
        run: |
          npm ci --ignore-scripts
          npm run format:check
      - name: Install Emscripten 6.0.10
        run: |
          git clone --depth 1 --branch 6.0.10 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # Formatting, clippy for native and WebAssembly, the fast tests (including the C/Rust
      # Argon2 cross-check), both Emscripten builds under Node.js, the browser package and the
      # release-artifact check. The full-size vector replay runs in vectors.yml.
      - name: Run all checks
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          scripts/check.sh
      # The browser package that check.sh built, in real Chromium and Firefox at a reduced Argon2
      # cost: Blob workers under the wallet tools' Content-Security-Policy, standard and fast mode,
      # cancellation and failing callbacks. The browsers are the ones Playwright 1.63.0 pins.
      - name: Check the browser package in Chromium and Firefox
        timeout-minutes: 20
        run: |
          npx playwright install --with-deps chromium firefox
          node scripts/verify-browsers.mjs

  # The fast tests on Windows and macOS, and the hidden password input in each system's own
  # pseudo-terminal, with public test data only. The release builds for these systems come from
  # the canonical container (Windows) and release.yml (macOS); this runs their code natively.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run the fast tests
        run: cargo test --locked
      - name: Build the command-line tool
        run: cargo build --locked
      - name: Check hidden input in a Unix pseudo-terminal
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: python3 scripts/verify-hidden-input.py target/debug/mhfe
      - name: Check hidden input in a Windows pseudo-console
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          # Only the exact files listed with their SHA-256 in the requirements file are accepted.
          python -m pip install --require-hashes -r scripts/verify-hidden-input-windows-requirements.txt
          python scripts/verify-hidden-input-windows.py target/debug/mhfe.exe

  canonical-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify canonical release assets
        run: scripts/build-reproducible.sh
      - name: Print canonical checksums
        run: cat canonical-output/release/SHA256SUMS
      - name: Preserve canonical build assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mhfe-canonical-${{ github.sha }}
          path: canonical-output/release/
          if-no-files-found: error
          retention-days: 7
