name: CI

on:
  # Branches only: the release workflow calls this one for the tagged commit itself. Dependabot's
  # branches are checked through their pull requests alone, so that each of its commits is checked
  # once, not once for the push and again for the pull request (AUD-023-BLD006).
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:
  # The release workflow runs these checks on the tagged commit before it publishes, so that a
  # release cannot skip any of them (AUD-015-BLD002). Its own canonical job builds the assets.
  workflow_call:
  # By hand, the checks with the canonical build of this workflow.
  workflow_dispatch:

# A newer push to the same branch or pull request makes a running check pointless, and so does a
# second run of the same commit: a branch of this repository and its pull request share one group
# (AUD-023-BLD006), while a fork's branch has its own. A tag that release.yml checks has the group
# of its name.
concurrency:
  group: >-
    ci-${{ github.ref_type }}
    ${{ github.event.pull_request.head.repo.full_name || github.repository }}
    ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The slow checks of a release, which a push or a pull request never runs (CI-04): for a release
  # tag, which release.yml checks through this workflow, and by hand.
  RELEASE_CHECKS: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release checks read the commits that .git-blame-ignore-revs names.
          fetch-depth: ${{ env.RELEASE_CHECKS == 'true' && '0' || '1' }}
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify standalone dependency graph
        run: |
          cargo metadata --locked --format-version 1 | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          root_manifest = data["workspace_root"] + "/Cargo.toml"
          foreign = [
              p["manifest_path"]
              for p in data["packages"]
              if p["source"] is None and p["manifest_path"] != root_manifest
          ]
          if foreign:
              raise SystemExit(f"unexpected local/path packages: {foreign}")
          '
      # The Node.js of the workspace for Prettier, the browser package checks and Playwright, and
      # pnpm, in the version package.json names in packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The tools come from pnpm-lock.yaml, each checked against its integrity hash.
      - name: Install the Node.js tools
        run: pnpm install --frozen-lockfile
      # Formatting, the copy gate, clippy for native and WebAssembly, the fast tests (including the
      # C/Rust Argon2 cross-check) and Prettier.
      - name: Run the fast checks
        if: ${{ env.RELEASE_CHECKS != 'true' }}
        run: scripts/check-fast.sh
      - name: Install Emscripten 6.0.12
        if: ${{ env.RELEASE_CHECKS == 'true' }}
        run: |
          git clone --depth 1 --branch 6.0.12 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Install pinned wasm-bindgen CLI
        if: ${{ env.RELEASE_CHECKS == 'true' }}
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # The fast checks, then both Emscripten builds under Node.js, the browser package, each
      # module built alone, the terminal with the full-size cases and the release-artifact check.
      # The full-size vector replay runs in vectors.yml.
      - name: Run all checks
        if: ${{ env.RELEASE_CHECKS == 'true' }}
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          scripts/check.sh
      # The browser package that check.sh built, in real Chromium and Firefox at a reduced Argon2
      # cost: Blob workers under the wallet tools' Content-Security-Policy, standard and fast mode,
      # cancellation and failing callbacks. The browsers are the ones Playwright 1.64.0 pins. Each
      # of the four pages ends by itself within the hour of PAGE_LIMIT_MS in
      # scripts/verify-browsers.mjs, so that the step's own limit never cuts a page off before it
      # reports (AUD-023-BLD005).
      - name: Check the browser package in Chromium and Firefox
        if: ${{ env.RELEASE_CHECKS == 'true' }}
        timeout-minutes: 245
        run: |
          pnpm exec playwright install --with-deps chromium firefox
          node scripts/verify-browsers.mjs
      # The results and console messages of each page, for a run that failed or stopped.
      - name: Keep the browser logs
        if: ${{ failure() && env.RELEASE_CHECKS == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check-${{ github.sha }}
          path: target/browser-check/*.log
          retention-days: 7

  # The fast tests on Windows and macOS, and the hidden password input in each system's own
  # pseudo-terminal, with public test data only. The release builds for these systems come from
  # the canonical container (Windows) and release.yml (macOS); this runs their code natively.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Code for macOS alone and the build with Microsoft's compiler are compiled only here, so
    # warnings fail the job.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run the fast tests
        env:
          # Authorize only the fixed, public-data attachment monitor; cargo stays unprivileged.
          MHFE_PUBLIC_MACOS_ATTACH_PROBE_SUDO: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: cargo test --locked
      # The PTY cases compare every candidate for two missing words. Their existing deadline
      # assumes optimized code; the debug build can spend the whole step on that search.
      - name: Build the optimized command-line tool
        run: cargo build --locked --release --bin mhfe
      - name: Apply and verify the macOS hardened runtime
        if: runner.os == 'macOS'
        run: scripts/harden-macos.sh target/release/mhfe
      # The fast cases; those that run Argon2 at full size run in scripts/check.sh, on Linux.
      - name: Check hidden input in a Unix pseudo-terminal
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: python3 scripts/verify-hidden-input.py target/release/mhfe
      - name: Check hidden input in a Windows pseudo-console
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          # Only the exact files listed with their SHA-256 in the requirements file are accepted.
          python -m pip install --require-hashes -r scripts/verify-hidden-input-windows-requirements.txt
          python scripts/verify-hidden-input-windows.py target/release/mhfe.exe

  canonical-build:
    # An hour-long build runs only by hand and for a release, whose workflow builds the assets
    # itself; never on a push or a pull request.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify canonical release assets
        run: scripts/build-reproducible.sh
      - name: Print canonical checksums
        run: cat canonical-output/release/SHA256SUMS
      - name: Preserve canonical build assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mhfe-canonical-${{ github.sha }}
          path: canonical-output/release/
          if-no-files-found: error
          retention-days: 7

  # Accept the exact GNU executable shipped by the canonical container as well as the MSVC
  # build in portable. Download only this run's source-bound artifact, never a released binary.
  canonical-windows:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: canonical-build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mhfe-canonical-${{ github.sha }}
          path: canonical-output-windows
      - name: Verify the canonical checksums and unpack the Windows package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-checksums.mjs canonical-output-windows
          version="v$(node scripts/cargo-output.mjs version)"
          python -m zipfile -e "canonical-output-windows/mhfe-$version-windows-x86_64.zip" canonical-output-windows/program
      - name: Check the canonical GNU program in a Windows pseudo-console
        run: |
          python -m pip install --require-hashes -r scripts/verify-hidden-input-windows-requirements.txt
          python scripts/verify-hidden-input-windows.py canonical-output-windows/program/mhfe.exe

  # Native package acceptance without a tag, release publication or Homebrew. Both archives are
  # built on the same host; their extracted payloads must retain hardened signatures and repack
  # identically after irrelevant checkout metadata changes (AUD-024-BLD009).
  macos-packages:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and package targets
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build and verify both macOS packages
        run: |
          version="v$(node scripts/cargo-output.mjs version)"
          scripts/package-release.sh "$version" canonical-output-macos macos-aarch64 macos-x86_64
          node scripts/verify-release-checksums.mjs canonical-output-macos
          python3 scripts/verify-macos-packages.py "$version" canonical-output-macos
      - name: Preserve accepted macOS packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mhfe-macos-${{ github.sha }}
          path: canonical-output-macos/
          if-no-files-found: error
          retention-days: 7
