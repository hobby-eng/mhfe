name: CI

on:
  # Branches only: the release workflow calls this one for the tagged commit itself.
  push:
    branches: ["**"]
  pull_request:
  # The release workflow runs these checks on the tagged commit before it publishes, so that a
  # release cannot skip any of them (AUD-015-BLD002). Its own canonical job builds the assets.
  workflow_call:
  # By hand, the checks with the canonical build of this workflow.
  workflow_dispatch:

# A newer push to the same branch or pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # About twenty minutes; a hang ends here rather than at GitHub's six hours.
    timeout-minutes: 90
    env:
      DPRINT: "0.63.0"
      DPRINT_SHA256: f58b5d7c13ccd613cfa264f1ae82d4e5db1373f8fe20462bc1126051d111b0ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        run: rustup show
      # A secret command stops on unencrypted swap it cannot forbid, and this runner has no user
      # systemd to forbid it.
      - name: Turn swap off
        run: sudo swapoff -a
      - name: Verify standalone dependency graph
        run: cargo xtask standalone
      # dprint formats the Markdown, JSON, TOML, YAML and the JavaScript of the check pages
      # (CORE-21); dprint.json pins its plugins with their SHA-256.
      - name: Install dprint, checked against its SHA-256
        run: |
          archive="dprint-x86_64-unknown-linux-gnu.zip"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/dprint/dprint/releases/download/$DPRINT/$archive"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Check formatting
        run: dprint check
      - name: Install Emscripten 6.0.12
        run: |
          git clone --depth 1 --branch 6.0.12 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # Formatting, clippy for native and WebAssembly, the fast tests, the build and static checks
      # of the browser package and the release-artifact check.
      - name: Run all checks
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          scripts/check.sh
      # The browser package that check.sh built in real browsers, and its comparison with the
      # program: by hand only. A release runs these checks on its canonical archives (release.yml).
      - name: Check the browser package in Chrome and Firefox
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 60
        uses: ./.github/actions/browser-checks

  # The fast tests on Windows, macOS on Apple silicon and Intel, and ARM64 Linux, and the hidden
  # password input in each system's own pseudo-terminal, with public test data only. The release
  # builds for these systems come from the canonical container; this runs their code natively, the
  # Windows program with the GNU toolchain it is released with as well as with MSVC. The Intel Mac
  # runs the debug build about three times slower than the others, so its code is optimized at
  # level 1, debug assertions kept, for the terminal suite's search of two words to fit its time.
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
          - os: windows-2025
            target: x86_64-pc-windows-gnu
          - os: macos-15
          - os: macos-15-intel
            dev-opt-level: 1
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Code for one system alone is compiled only here, so warnings fail the job.
    env:
      RUSTFLAGS: -D warnings
      TARGET: ${{ matrix.target }}
      CARGO_PROFILE_DEV_OPT_LEVEL: ${{ matrix.dev-opt-level || 0 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          if [ -n "$TARGET" ]; then rustup target add "$TARGET"; fi
      - name: Lint for this system
        shell: bash
        run: |
          cargo clippy --locked --all-targets --all-features ${TARGET:+--target "$TARGET"} \
            -- -D warnings
          cargo clippy --locked --package xtask --all-targets -- -D warnings
      - name: Run the fast tests
        shell: bash
        run: cargo test --locked ${TARGET:+--target "$TARGET"}
      - name: Build the command-line tool
        shell: bash
        run: cargo build --locked ${TARGET:+--target "$TARGET"}
      - name: Sign the tool with the hardened runtime and check it
        if: runner.os == 'macOS'
        run: |
          cargo xtask macos-binary target/debug/mhfe
          cargo xtask hardened "$PWD/target/debug/mhfe"
      - name: Check hidden input in a Unix pseudo-terminal
        if: runner.os != 'Windows'
        timeout-minutes: 20
        run: cargo xtask terminal target/debug/mhfe
      # In PowerShell: started from Git's bash, the tool in the pseudo-console never ended.
      - name: Check hidden input in a Windows pseudo-console
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dir = if ($env:TARGET) { "target/$env:TARGET/debug" } else { "target/debug" }
          cargo xtask terminal "$dir/mhfe.exe"

  canonical-build:
    # An hour-long build runs only by hand and for a release, whose workflow builds the assets
    # itself; never on a push or a pull request.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The tests in the container run secret commands, which stop on unencrypted swap there.
      - name: Turn swap off
        run: sudo swapoff -a
      - name: Build and verify canonical release assets
        run: scripts/build-reproducible.sh
      - name: Print canonical checksums
        run: cat canonical-output/release/SHA256SUMS
      - name: Preserve canonical build assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mhfe-canonical-${{ github.sha }}
          path: canonical-output/release/
          if-no-files-found: error
          retention-days: 7
