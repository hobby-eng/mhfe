name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify standalone dependency graph
        run: |
          cargo metadata --locked --format-version 1 | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          root_manifest = data["workspace_root"] + "/Cargo.toml"
          foreign = [
              p["manifest_path"]
              for p in data["packages"]
              if p["source"] is None and p["manifest_path"] != root_manifest
          ]
          if foreign:
              raise SystemExit(f"unexpected local/path packages: {foreign}")
          '
      - name: Native and WASM checks
        run: scripts/check.sh
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Build browser distribution
        run: scripts/build-wasm.sh
      - name: Verify browser API outputs
        run: |
          test -s dist/wasm/mhfe.js
          test -s dist/wasm/mhfe_bg.wasm
          test -s dist/wasm/mhfe.d.ts
          test -s dist/client.d.ts
          grep -q 'class MhfeEngine' dist/wasm/mhfe.d.ts
          grep -q 'suiteParametersJson' dist/wasm/mhfe.d.ts
          grep -q 'interface MhfeEncryptionResult' dist/client.d.ts
          node scripts/verify-wasm-api.mjs
          node scripts/verify-worker-client.mjs
      - name: Exercise operational WASM exports
        timeout-minutes: 15
        run: node scripts/verify-wasm-api.mjs --operational

  canonical-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify canonical release assets
        run: scripts/build-reproducible.sh
      - name: Print canonical checksums
        run: cat canonical-output/release/SHA256SUMS
      - name: Preserve canonical build assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mhfe-canonical-${{ github.sha }}
          path: canonical-output/release/
          if-no-files-found: error
          retention-days: 7
