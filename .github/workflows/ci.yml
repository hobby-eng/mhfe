name: CI

on:
  # Branches only: the release workflow calls this one for the tagged commit itself.
  push:
    branches: ["**"]
  pull_request:
  # The release workflow runs these checks on the tagged commit before it publishes, so that a
  # release cannot skip any of them (AUD-015-BLD002). Its own canonical job builds the assets.
  workflow_call:
  # By hand, the checks with the canonical build of this workflow.
  workflow_dispatch:

# A newer push to the same branch or pull request makes a running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      DPRINT: "0.63.0"
      DPRINT_SHA256: f58b5d7c13ccd613cfa264f1ae82d4e5db1373f8fe20462bc1126051d111b0ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify standalone dependency graph
        run: |
          cargo metadata --locked --format-version 1 | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          # The package and its tools (xtask), and no other package from a local path.
          root = data["workspace_root"]
          own = {root + "/Cargo.toml", root + "/xtask/Cargo.toml"}
          foreign = [
              p["manifest_path"]
              for p in data["packages"]
              if p["source"] is None and p["manifest_path"] not in own
          ]
          if foreign:
              raise SystemExit(f"unexpected local/path packages: {foreign}")
          '
      # The Node.js of the workspace for the browser package checks that still run in it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # dprint formats the Markdown, JSON, TOML and YAML (CORE-21); dprint.json pins its plugins
      # with their SHA-256.
      - name: Install dprint, checked against its SHA-256
        run: |
          archive="dprint-x86_64-unknown-linux-gnu.zip"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/dprint/dprint/releases/download/$DPRINT/$archive"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Check formatting
        run: dprint check
      - name: Install Emscripten 6.0.12
        run: |
          git clone --depth 1 --branch 6.0.12 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # Formatting, clippy for native and WebAssembly, the fast tests (including the C/Rust
      # Argon2 cross-check), both Emscripten builds under Node.js, the browser package and the
      # release-artifact check. The full-size vector replay runs in vectors.yml.
      - name: Run all checks
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          scripts/check.sh
      # The browser package that check.sh built, in real Chrome and Firefox at a reduced Argon2
      # cost: Blob workers under the wallet tools' Content-Security-Policy, standard and fast mode,
      # cancellation and failing callbacks. The browsers are the archives that
      # xtask/src/browser.rs names, checked against their SHA-256 and unpacked as it expects.
      - name: Check the browser package in Chrome and Firefox
        timeout-minutes: 30
        env:
          MHFE_BROWSERS: ${{ runner.temp }}/browsers
        run: |
          mkdir -p "$MHFE_BROWSERS"
          cd "$MHFE_BROWSERS"
          get() {
            mkdir -p "$1"
            curl --fail --silent --show-error --location --proto '=https' --output "$1/$2" "$3"
          }
          chrome="https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.79/linux64"
          get chrome-155.0.8059.79 chrome-linux64.zip "$chrome/chrome-linux64.zip"
          get chromedriver-155.0.8059.79 chromedriver-linux64.zip "$chrome/chromedriver-linux64.zip"
          get firefox-158.0 firefox-158.0.tar.xz \
            https://ftp.mozilla.org/pub/firefox/releases/158.0/linux-x86_64/en-US/firefox-158.0.tar.xz
          get geckodriver-0.37.1 geckodriver-v0.37.1-linux64.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          sha256sum --check --strict <<'SUMS'
          bcd9a79130d7e44d70f93be87042e9bcee7fe0f0b3898e06b8c9bed5fb619dcd  chrome-155.0.8059.79/chrome-linux64.zip
          876f0ea4095237bb3e93321d95758d38c9195989935d7bdc9f51d8e26bc6a3a1  chromedriver-155.0.8059.79/chromedriver-linux64.zip
          9549b054ec4cf85f50f6a19d8c6fb79580312e71ebc4ec2cb217ec9af09dc12a  firefox-158.0/firefox-158.0.tar.xz
          e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  geckodriver-0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          SUMS
          unzip -q chrome-155.0.8059.79/chrome-linux64.zip -d chrome-155.0.8059.79
          unzip -q chromedriver-155.0.8059.79/chromedriver-linux64.zip -d chromedriver-155.0.8059.79
          tar -xJf firefox-158.0/firefox-158.0.tar.xz -C firefox-158.0
          tar -xzf geckodriver-0.37.1/geckodriver-v0.37.1-linux64.tar.gz -C geckodriver-0.37.1
          cd "$GITHUB_WORKSPACE"
          # The drivers' own messages tell why a browser did not start.
          cargo xtask browsers || { tail -n 50 target/browser-check/*.log; exit 1; }

  # The fast tests on Windows and macOS, and the hidden password input in each system's own
  # pseudo-terminal, with public test data only. The release builds for these systems come from
  # the canonical container (Windows) and release.yml (macOS); this runs their code natively.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Code for macOS alone and the build with Microsoft's compiler are compiled only here, so
    # warnings fail the job.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run the fast tests
        run: cargo test --locked
      - name: Build the command-line tool
        run: cargo build --locked
      - name: Check hidden input in a Unix pseudo-terminal
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: python3 scripts/verify-hidden-input.py target/debug/mhfe
      - name: Check hidden input in a Windows pseudo-console
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          # Only the exact files listed with their SHA-256 in the requirements file are accepted.
          python -m pip install --require-hashes -r scripts/verify-hidden-input-windows-requirements.txt
          python scripts/verify-hidden-input-windows.py target/debug/mhfe.exe

  canonical-build:
    # An hour-long build runs only by hand and for a release, whose workflow builds the assets
    # itself; never on a push or a pull request.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify canonical release assets
        run: scripts/build-reproducible.sh
      - name: Print canonical checksums
        run: cat canonical-output/release/SHA256SUMS
      - name: Preserve canonical build assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mhfe-canonical-${{ github.sha }}
          path: canonical-output/release/
          if-no-files-found: error
          retention-days: 7
