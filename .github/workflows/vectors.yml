name: Published vectors

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/lib.rs
      - tests/published_vectors.rs
      - .github/workflows/vectors.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/lib.rs
      - tests/published_vectors.rs
      - .github/workflows/vectors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Replay all published vectors in both directions
        run: cargo test --locked --release --test published_vectors -- --ignored --nocapture
