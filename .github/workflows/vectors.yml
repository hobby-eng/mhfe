name: Test vectors

# Replays the full-size suite 3 test vectors with the Rust implementation and checks them again
# with an independent script that uses OpenSSL's Argon2. It takes about two hours, so it runs only
# when the implementation or the vectors change, on request, and for every release: release.yml
# calls it for the tagged commit and publishes only after it has passed.
on:
  # Branches only: for a release tag, release.yml calls this workflow itself.
  push:
    branches: ["**"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - vendor/phc-winner-argon2/**
      - tests/suite3_vectors.rs
      - tests/fixtures/**
      - scripts/independent-suite3.py
      - scripts/independent-suite3-requirements.txt
      - .github/workflows/vectors.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - vendor/phc-winner-argon2/**
      - tests/suite3_vectors.rs
      - tests/fixtures/**
      - scripts/independent-suite3.py
      - scripts/independent-suite3-requirements.txt
      - .github/workflows/vectors.yml
  workflow_dispatch:
  workflow_call:

# The replay takes about two hours; a newer push to the same branch makes a running one pointless.
# The group is named here rather than after github.workflow, which in a call from release.yml is
# "Release": a shared group would make the release and its own replay wait for each other.
concurrency:
  group: vectors-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Replay every vector in both directions
        run: cargo test --locked --release --test suite3_vectors -- --ignored --nocapture
      - name: Check every vector with an independent implementation
        run: |
          # Only the exact files listed with their SHA-256 in the requirements file are accepted.
          python3 -m pip install --user --require-hashes -r scripts/independent-suite3-requirements.txt
          python3 scripts/independent-suite3.py passwords tests/fixtures/validation-cases.json
          # Every file listed in SHA256SUMS: the vectors and the negative cases, not the
          # independent-verification.json record next to them.
          cd tests/fixtures/suite3-vectors
          python3 ../../../scripts/independent-suite3.py vector $(cut -d' ' -f3 SHA256SUMS)
