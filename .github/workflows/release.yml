name: Release

on:
  push:
    tags:
      - "v*"

# One release run per tag at a time, never cancelled half-way: a second push of the same tag
# waits. Cancel an outdated release run by hand before it publishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Linux x86-64 and ARM64, Windows x86-64, macOS on Intel and Apple silicon and the browser
  # package, byte for byte reproducible.
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The SHA-256 of the container's SHA256SUMS, which only this job can set: every later job that
    # takes the archives compares the checksum file it downloads with it.
    outputs:
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify tag and repository
        run: |
          package_version="$(cargo xtask package-version)"
          test "$GITHUB_REF_NAME" = "v$package_version"
          # The release text comes from curated notes; a tag without them fails this job here,
          # before the canonical build, and no draft is made. The CI jobs of this run still run.
          test -s "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "Missing release notes: docs/releases/$GITHUB_REF_NAME.md" >&2
            exit 1
          }
      # The draft takes its text from here, so that no job that may write checks out the repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: docs/releases/${{ github.ref_name }}.md
          if-no-files-found: error
      - name: Audit Cargo.lock against RustSec
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false
      # The tests in the container run secret commands, which stop on unencrypted swap there.
      - name: Turn swap off
        run: sudo swapoff -a
      # The container's own SHA256SUMS travels with the archives as canonical.sha256, and its own
      # SHA-256 as this job's output, so that the attestation job can prove it received exactly the
      # bytes this job built: an artifact can be replaced within the run, a job's output cannot.
      - name: Build release assets in the canonical container
        id: build
        run: |
          scripts/build-reproducible.sh canonical-output
          cp canonical-output/release/SHA256SUMS canonical-output/release/canonical.sha256
          sums="$(sha256sum < canonical-output/release/SHA256SUMS | cut -d' ' -f1)"
          echo "sums=$sums" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical
          path: canonical-output/release/*.*
          if-no-files-found: error

  # The macOS programs come from the canonical job, linked by Zig without Apple's SDK; here they run
  # on a Mac: the self-test and the terminal suite, the Intel one through Rosetta 2.
  macos:
    needs: canonical
    strategy:
      matrix:
        package: [macos-aarch64, macos-x86_64]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run the fast tests
        if: matrix.package == 'macos-aarch64'
        run: cargo test --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical
          path: canonical
      # Before anything of them runs: the archives as the canonical job built them.
      - name: Check the canonical archives against the canonical job
        env:
          SUMS: ${{ needs.canonical.outputs.sums }}
        run: |
          cd canonical
          test -n "$SUMS"
          test "$(shasum -a 256 < canonical.sha256 | cut -d' ' -f1)" = "$SUMS"
          shasum -a 256 --check --strict canonical.sha256
      - name: Unpack the canonical program
        run: |
          if [ "${{ matrix.package }}" = macos-x86_64 ]; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          mkdir program
          tar --extract --gzip \
            --file "canonical/mhfe-$GITHUB_REF_NAME-${{ matrix.package }}.tar.gz" \
            --directory program ./mhfe
          program/mhfe --version
      # Its signature, as macOS reads it: ad hoc with the hardened runtime, which keeps its task
      # port, and with it its memory, from other processes (xtask/src/hardened.rs).
      - name: Hardened runtime of the canonical program
        run: cargo xtask hardened "$PWD/program/mhfe"
      - name: Self-test of the canonical program
        run: program/mhfe self-test
      - name: Terminal suite of the canonical program
        run: cargo xtask terminal "$PWD/program/mhfe"

  # The browser checks on what is published, the archives of the canonical job: the browser package
  # in real browsers, which the canonical container does not have, and its comparison with the
  # Linux program.
  browser-package:
    needs: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical
          path: canonical
      # Before anything of them runs: the archives as the canonical job built them.
      - name: Check the canonical archives against the canonical job
        env:
          SUMS: ${{ needs.canonical.outputs.sums }}
        run: |
          cd canonical
          test -n "$SUMS"
          test "$(sha256sum < canonical.sha256 | cut -d' ' -f1)" = "$SUMS"
          sha256sum --check --strict canonical.sha256
      - name: Unpack the canonical browser package and program
        run: |
          mkdir dist
          tar --extract --gzip --file "canonical/mhfe-$GITHUB_REF_NAME-browser.tar.gz" \
            --directory dist
          mkdir -p target/release
          tar --extract --gzip --file "canonical/mhfe-$GITHUB_REF_NAME-linux-x86_64.tar.gz" \
            --directory target/release ./mhfe
      - uses: ./.github/actions/browser-checks

  # Every check of CI on the tagged commit, scripts/check.sh and the terminal suites of Windows and
  # macOS included, which the canonical container runs only in part (AUD-015-BLD002). Its canonical
  # build is this workflow's canonical job, and browser-package holds its browser checks; CI's own
  # run only by hand.
  checks:
    uses: ./.github/workflows/ci.yml

  # Each fuzz target for 90 seconds under the sanitizer: a tag on which one finds a fault gets no
  # release.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # With the specification, whose files the library takes in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Install the pinned nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly-2026-11-13 --profile minimal
          cargo +nightly-2026-11-13 install cargo-fuzz --locked --version 0.13.2
      - name: Run every fuzz target for 90 seconds
        run: |
          set -euo pipefail
          # The fuzz workspace's own lockfile, unchanged: cargo-fuzz has no --locked of its own.
          cargo +nightly-2026-11-13 fetch --locked --manifest-path fuzz/Cargo.toml
          targets=$(cargo +nightly-2026-11-13 fuzz list --fuzz-dir fuzz)
          test -n "$targets"
          for target in $targets; do
            cargo +nightly-2026-11-13 fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu \
              "$target" -- -max_total_time=90 -rss_limit_mb=3000 -max_len=4096
          done
          # cargo-fuzz could have resolved anew: the results count only for the checked-in graph.
          git diff --exit-code -- fuzz/Cargo.lock
      - name: Keep the inputs of a fault
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # Checks every asset against the job that built it and attests them. It may sign, not write, and
  # runs only pinned actions and a fixed check: no code of the repository.
  attest:
    needs: [checks, fuzz, canonical, browser-package, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # For the build provenance (actions/attest): the workflow's OIDC identity gets a short-lived
      # Sigstore signing certificate, and GitHub stores the attestation. No artifact-metadata: the
      # action writes a storage record only for images pushed to a registry, not for files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical
          path: release
      # The checksum file of the canonical job, whose own SHA-256 that job gave as its output, is
      # the only list: the folder must hold exactly the archives it names, each as it was built,
      # and it becomes the release's SHA256SUMS. A file changed or added between the jobs stops
      # the release here.
      - name: Check every asset against the canonical job's SHA256SUMS
        env:
          SUMS: ${{ needs.canonical.outputs.sums }}
        run: |
          cd release
          test -n "$SUMS"
          test "$(sha256sum < canonical.sha256 | cut -d' ' -f1)" = "$SUMS"
          mv canonical.sha256 SHA256SUMS
          diff <({ cut -d' ' -f3 SHA256SUMS; echo SHA256SUMS; } | sort) <(ls -A | sort)
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
      - name: Generate build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # The only job that may write: it makes the draft from the attested assets and the notes, with gh
  # alone. The signing key stays on the maintainer's computer. Publish only after downloading,
  # checking and OpenPGP-signing SHA256SUMS as described in docs/RELEASING.md.
  draft:
    needs: [canonical, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # The files attested, checked again as there: the canonical job's SHA256SUMS and exactly the
      # archives it names.
      - name: Prepare the verified release draft for OpenPGP signing
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS: ${{ needs.canonical.outputs.sums }}
        run: |
          (
            cd release
            test -n "$SUMS"
            test "$(sha256sum < SHA256SUMS | cut -d' ' -f1)" = "$SUMS"
            diff <({ cut -d' ' -f3 SHA256SUMS; echo SHA256SUMS; } | sort) <(ls -A | sort)
            sha256sum --check --strict SHA256SUMS
          )
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --title "MHFE $GITHUB_REF_NAME" \
            --notes-file "notes/$GITHUB_REF_NAME.md" \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
