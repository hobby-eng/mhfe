name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify tag and repository
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"
          cargo metadata --locked --format-version 1 | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          root_manifest = data["workspace_root"] + "/Cargo.toml"
          foreign = [p["manifest_path"] for p in data["packages"] if p["source"] is None and p["manifest_path"] != root_manifest]
          if foreign:
              raise SystemExit(f"unexpected local/path packages: {foreign}")
          '
      - name: Audit Cargo.lock against RustSec
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
        with:
          createIssues: false
      - name: Check native and WASM code
        run: scripts/check.sh
      - name: Replay all published vectors in both directions
        run: cargo test --locked --release --test published_vectors -- --ignored --nocapture
      - name: Build verified release assets in the canonical container
        run: scripts/build-reproducible.sh canonical-output
      - name: Print release checksums
        run: cat canonical-output/release/SHA256SUMS
      - name: Generate GitHub build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'canonical-output/release/*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            canonical-output/release/* \
            --title "MHFE: Memory-Hard Feistel Encryption for BIP39 Mnemonics $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
