name: Release

on:
  push:
    tags:
      - "v*"

# One release run per tag at a time, never cancelled half-way: a second push of the same tag
# waits. Cancel an outdated release run by hand before it publishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Linux x86-64 and ARM64, Windows x86-64 and the browser package, byte for byte reproducible.
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Verify tag and repository
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"
          # The release text comes from curated notes; a tag without them fails this job here,
          # before the canonical build, and no draft is made. The macOS and CI jobs of this run,
          # and vectors.yml for the tag, still run.
          test -s "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "Missing release notes: docs/releases/$GITHUB_REF_NAME.md" >&2
            exit 1
          }
      - name: Audit Cargo.lock against RustSec
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false
      # The container's own SHA256SUMS travels with the archives as canonical.sha256, so that the
      # publishing job can prove it received exactly the bytes this job built.
      - name: Build release assets in the canonical container
        run: |
          scripts/build-reproducible.sh canonical-output
          cp canonical-output/release/SHA256SUMS canonical-output/release/canonical.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical
          path: canonical-output/release/*.*
          if-no-files-found: error

  # macOS needs Apple's SDK, so these two are built on macOS runners.
  macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            package: macos-aarch64
          - target: x86_64-apple-darwin
            package: macos-x86_64
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
          brew install gnu-tar
      - name: Run the fast tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked
      # package-release.sh builds the program itself, with the builder's directories remapped.
      - name: Build and package
        run: |
          scripts/package-release.sh "$GITHUB_REF_NAME" macos-output ${{ matrix.package }}
          cp macos-output/SHA256SUMS "macos-output/${{ matrix.package }}.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}
          path: |
            macos-output/*.tar.gz
            macos-output/${{ matrix.package }}.sha256
          if-no-files-found: error

  # Every check of CI on the tagged commit, scripts/check.sh, the browsers and the terminal suites
  # of Windows and macOS included, which the canonical container runs only in part
  # (AUD-015-BLD002). Its canonical build is this workflow's canonical job.
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      skip-canonical-build: true

  # The full-size vectors are replayed for the same tag by vectors.yml, on its own, in about
  # three hours; the draft does not wait for them, and their result shows on the tag.
  publish:
    needs: [checks, canonical, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the build provenance (actions/attest): the workflow's OIDC identity gets a short-lived
      # Sigstore signing certificate, and GitHub stores the attestation. No artifact-metadata: the
      # action writes a storage record only for images pushed to a registry, not for files.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      # Every archive must match the checksum written by the job that built it, and every archive
      # must be covered: a file changed or added between the jobs stops the release here.
      - name: Check every asset against its building job, then write SHA256SUMS
        run: |
          cd release
          cat -- *.sha256 > built.sha256sums
          sha256sum --check --strict built.sha256sums
          diff <(cut -d' ' -f3 built.sha256sums | sort) <(ls -- *.tar.gz *.zip | sort)
          rm -- *.sha256 built.sha256sums
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Generate build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/*"
      # The signing key stays on the maintainer's computer. Publish only after downloading,
      # checking and OpenPGP-signing SHA256SUMS as described in docs/RELEASING.md.
      - name: Prepare the verified release draft for OpenPGP signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --title "MHFE $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag
