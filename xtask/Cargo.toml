[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
description = "The tools of the mhfe repository, run as `cargo xtask <task>`"
license = "MIT"
publish = false

# Explicit, so that the workspace loads where only the manifests are copied (the dependencies stage
# of packaging/Dockerfile.reproducible).
[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The versions mhfe itself uses (CORE-25), so the lock file gains no crate.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[target.'cfg(unix)'.dependencies]
# For the terminal cases' pseudo-terminal; the versions mhfe and its dependencies use.
libc = "=0.2.191"
nix = { version = "=0.31.3", features = ["fs", "poll", "process", "resource", "signal", "term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[lints.rust]
unsafe_code = "deny" # "deny", not "forbid": the terminal cases' system calls allow it (RUST-07)
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny" # at 150 lines, CORE-15
mod_module_files = "deny" # RUST-03
undocumented_unsafe_blocks = "deny" # RUST-07
allow_attributes_without_reason = "deny" # a lint exception gives its reason (code-core)
