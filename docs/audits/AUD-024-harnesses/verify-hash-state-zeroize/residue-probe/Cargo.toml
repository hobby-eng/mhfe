[package]
name = "hash-state-residue-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mhfe-experimental = { path = "../../../../.." }
bip39 = "=3.0.0"
hex = "=0.4.3"
# Present only to switch the feature on for mhfe's own copies (feature unification).
blake2 = { version = "=0.11.0", optional = true }
hmac = { version = "=0.13.0", optional = true }
sha2 = { version = "=0.11.0", optional = true }

[features]
wipe = ["dep:blake2", "dep:hmac", "dep:sha2", "blake2/zeroize", "hmac/zeroize", "sha2/zeroize"]

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"

[workspace]
