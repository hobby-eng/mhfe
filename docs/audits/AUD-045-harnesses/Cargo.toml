[package]
name = "aud045-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Public-data scheduling probe for the MHFE AUD-045 terminal review"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "=0.2.191"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
