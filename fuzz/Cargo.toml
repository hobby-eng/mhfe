[package]
name = "mhfe-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
mhfe = { path = "..", package = "mhfe-experimental" }

# Text read as an address, a derivation path or a master key fingerprint: a refusal or an answer,
# never a panic, and a fingerprint reads back as itself.
[[bin]]
name = "address"
path = "fuzz_targets/address.rs"
test = false
doc = false
bench = false

# Text read as an original phrase, a container, a damaged container with its card, or a container
# with a missing word: a refusal or an answer, never a panic.
[[bin]]
name = "phrases"
path = "fuzz_targets/phrases.rs"
test = false
doc = false
bench = false

# Bytes sent to mhfe serve and lines of its checksum file, through the server's own file: every
# answer is one the server gives, with every security header.
[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

# Text typed as a password, dice rolls or a line with word hints: a refusal or an answer, never a
# panic, and an index of rolls is on the list.
[[bin]]
name = "passwords"
path = "fuzz_targets/passwords.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

# The table of every crate (RUST-01). A fuzz target answers by stopping the run: each one allows
# unwraps and panics at its top, with the reason.
[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Its own workspace, with its own lockfile.
[workspace]
