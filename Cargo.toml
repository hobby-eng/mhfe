[package]
name = "mhfe-experimental"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.1"
authors = ["Sergei Semenov"]
description = "Experimental Memory-Hard Feistel Encryption for BIP39 Mnemonics"
repository = "https://github.com/hobby-eng/mhfe"
license = "MIT"
publish = false

[lib]
name = "mhfe"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mhfe"
path = "src/main.rs"
test = false
bench = false

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
bip39 = { version = "=3.0.0", features = ["zeroize"] }
blake2 = "=0.11.0"
hex = "=0.4.3"
hmac = "=0.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.128", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
