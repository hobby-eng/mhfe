# Tests may unwrap, expect and panic (RUST-01, RUST-05); library and front-end code returns errors.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# CORE-15: a function aims at 100 lines; one of 101 to 150 that is one whole stays, judged in
# review; the gate stops at 150.
too-many-lines-threshold = 150
